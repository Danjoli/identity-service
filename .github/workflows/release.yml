name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  validate-and-publish:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_service_test
          POSTGRES_USER: identity_service
          POSTGRES_PASSWORD: identity_service
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U identity_service -d identity_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_SECRET: github-actions-test-secret
      DATABASE_URL: postgresql://identity_service:identity_service@127.0.0.1:5432/identity_service?serverVersion=16&charset=utf8

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install and audit dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked

      - name: Validate application
        run: |
          php bin/console lexik:jwt:generate-keypair --skip-if-exists
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:schema:validate
          composer quality

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Publish application image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/danjoli/identity-service-app:${{ github.ref_name }}

      - name: Publish web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/danjoli/identity-service-web:${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
