
services:
###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_service}
      # Local development defaults only; production must inject secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-identity_service}
      POSTGRES_USER: ${POSTGRES_USER:-identity_service}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-identity_service}", "-U", "${POSTGRES_USER:-identity_service}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
