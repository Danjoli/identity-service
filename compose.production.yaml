services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET_KEY: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY: /run/secrets/jwt_public_key
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?JWT_PASSPHRASE is required}
      MAILER_DSN: ${MAILER_DSN:?MAILER_DSN is required}
      MAILER_FROM: ${MAILER_FROM:?MAILER_FROM is required}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
      JWT_TTL: ${JWT_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-3600}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1800}
    secrets:
      - jwt_private_key
      - jwt_public_key

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:8080"

secrets:
  jwt_private_key:
    file: ./config/jwt/private.pem
  jwt_public_key:
    file: ./config/jwt/public.pem
